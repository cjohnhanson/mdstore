# Generated by gaff from the gaff config. Do not edit.
# Change the config, then run `gaff init --github`.
# `gaff check --github` reports a file that drifted.
name: 'verify'

on:
  push:

jobs:
  verify:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: 'rust toolchain'
        uses: 'dtolnay/rust-toolchain@stable'
        with:
          'components': 'clippy, rustfmt'
      - name: 'rust cache'
        uses: 'Swatinem/rust-cache@v2'
      - name: 'install missouri'
        uses: 'cjohnhanson/missouri@main'
      - name: 'formatting'
        run: |
          cargo fmt --all --check
      - name: 'clippy'
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: 'tests'
        run: |
          cargo test --workspace --all-features
      - name: 'missouri suite'
        run: |
          sh -c '[ -d tests/missouri ] || exit 0; cd tests/missouri && missouri run'

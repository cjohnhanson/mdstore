# The review gate. This file is deliberately not generated by gaff.
#
# `pull_request_target` takes the workflow and every file it reads from
# the base branch, not from the pull request. That is the whole point:
# the policy in .gaff/gaff.yml, the criteria under .agents/skills, and
# this file all come from main, so a branch cannot weaken the check that
# judges it. A `pull_request` trigger reads them from the merge commit,
# which lets a branch approve itself.
#
# Nothing here checks out or runs the pull request's code. The job reads
# one sha from the event payload and one git note. Running head code
# under pull_request_target is the known way to break it.
name: 'review-gate'

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review-gate:
    runs-on: 'ubuntu-latest'
    steps:
      # No ref given, so this is the base branch: main's policy and
      # main's criteria.
      - uses: actions/checkout@v4

      - name: 'fetch the review notes and the head commit'
        run: |
          git fetch --no-tags origin '+refs/notes/reviews:refs/notes/reviews' || true
          git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"

      - name: 'every declared review signed off on the head commit'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          case "$HEAD_SHA" in
            [0-9a-f]*) ;;
            *) echo "review-gate: the head sha is unreadable. Refusing." >&2; exit 1 ;;
          esac

          # The policy and the criteria are main's, because this
          # checkout is main's.
          required=$(awk '/^reviews:/ {inside=1; next}
                          inside && /^  - / {print $2; next}
                          inside && !/^  - / {exit}' .gaff/gaff.yml)
          if [ -z "$required" ]; then
            echo "review-gate: .gaff/gaff.yml on the base branch declares no reviews." >&2
            echo "  Write reviews: [] to require none, or list the reviews a change must pass." >&2
            exit 1
          fi

          note=$(git notes --ref=reviews show "$HEAD_SHA" 2>/dev/null || true)
          if [ -z "$note" ]; then
            echo "review-gate: no review note on $HEAD_SHA." >&2
            echo "  Push the notes ref: git push origin refs/notes/reviews" >&2
            exit 1
          fi
          if printf '%s\n' "$note" | grep -q '^signoff\[[^]]*\] FAIL'; then
            echo "review-gate: the note carries a FAIL sign-off." >&2
            exit 1
          fi

          missing=
          for name in $required; do
            if [ ! -f ".agents/skills/$name/SKILL.md" ]; then
              echo "review-gate: $name is required and the base branch holds no criteria for it." >&2
              exit 1
            fi
            count=$(printf '%s\n' "$note" | grep -c "^signoff\[$name\] PASS " || true)
            if [ "$count" -eq 0 ]; then
              missing="$missing $name"
            elif [ "$count" -gt 1 ]; then
              echo "review-gate: $name signed off $count times on $HEAD_SHA. One line each." >&2
              exit 1
            fi
          done
          if [ -n "$missing" ]; then
            echo "review-gate: $HEAD_SHA carries no sign-off for:$missing" >&2
            echo "  Each review is a skill under .agents/skills on the base branch." >&2
            echo "  Record every line in one note, then push refs/notes/reviews:" >&2
            echo "    git notes --ref=reviews append -m 'signoff[<review>] PASS $HEAD_SHA <evidence>' $HEAD_SHA" >&2
            exit 1
          fi

          echo "review-gate: ok, enforced on $HEAD_SHA:$(printf ' %s' $required)"

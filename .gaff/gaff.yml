# The reviews a change must pass before it merges. `gaff reviews`
# prints them and `gaff reviews check` holds them, so the gate never
# hard-codes a name. An absent key is an error, because no policy must
# not read as no review required.
reviews:
  - fresh-eyes
  - mutation

# Repo-level gaff config. Two entries. The commit gate holds formatted
# code and a clean clippy on pre-commit. The merge gate holds tests,
# the missouri suite, and a fresh-eyes review note on pre-push, which
# is the merge check in a repo that merges by direct push. Installed by
# `gaff init --git`.
git:
  - name: commit-gate
    on:
      - pre-commit
    command:
      - sh
      - scripts/commit-gate.sh
  - name: merge-gate
    on:
      - pre-push
    command:
      - sh
      - scripts/merge-gate.sh

# The CI gate: the same declarations, run by gaff ci.
# Branch protection on main requires this check, so a sha needs a green
# gate before main accepts it. The pull_request trigger is load-bearing:
# a pull request from a fork raises no push event here, so without it
# the required check never reports and no pull request can merge.
github:
  - name: gate
    on:
      - push
      - pull_request
    steps:
      - name: fetch review notes
        command: [sh, -c, "git fetch origin +refs/notes/reviews:refs/notes/reviews || true"]
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rust cache
        uses: Swatinem/rust-cache@v2
      - name: gaff
        uses: cjohnhanson/gaff@main

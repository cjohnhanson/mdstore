# Repo-level gaff config. Two entries. The commit gate holds formatted
# code and a clean clippy on pre-commit. The merge gate holds tests,
# the missouri suite, and a fresh-eyes review note on pre-push, which
# is the merge check in a repo that merges by direct push. Installed by
# `gaff init --git`.
git:
  - name: commit-gate
    on:
      - pre-commit
    command:
      - sh
      - scripts/commit-gate.sh
  - name: merge-gate
    on:
      - pre-push
    command:
      - sh
      - scripts/merge-gate.sh

# The CI gate: the same declarations, run by gaff ci on every push.
# Branch protection on main requires this check, so a sha needs a green
# gate before main accepts it.
github:
  - name: gate
    on:
      - push
    steps:
      - name: fetch review notes
        command: [sh, -c, "git fetch origin +refs/notes/reviews:refs/notes/reviews || true"]
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rust cache
        uses: Swatinem/rust-cache@v2
      - name: gaff
        uses: cjohnhanson/gaff@main

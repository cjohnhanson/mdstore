[package]
name = "mdstore"
version = "0.3.5"
edition = "2024"
description = "Generic frontmattered markdown document store"
license = "MIT"
repository = "https://github.com/cjohnhanson/mdstore"
homepage = "https://github.com/cjohnhanson/mdstore"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["markdown", "frontmatter", "yaml", "document-store", "storage"]
categories = ["parser-implementations", "text-processing", "filesystem"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# The git cache, in-process. `blocking-network-client` for fetch and
# clone; the reqwest transport for http(s), so no git or curl process
# runs. gix's file transport would spawn git-upload-pack, so a local
# source is mirrored by reading its object database directly (git.rs).
gix = { version = "0.86", default-features = false, features = [
    "revision",
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
# The https blob store: an index and its documents over plain GET. The
# same reqwest gix uses, so one HTTP stack.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }

yaml_serde = "0.10"
thiserror = "2"
url = "2"
rand = "0.10.0"
cap-std = "4.0.2"

# The passwd database, for the home directory that anchors the user
# config path. $HOME is repo-settable (direnv, mise), and the user
# config names where writes land, so it never comes from the
# environment.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[features]
default = []
# The MCP scaffold. Off by default: a consumer that only builds a CLI
# should not pull in a server stack.
mcp = ["dep:serde_json", "dep:sha2"]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.sha2]
version = "0.11.0"
optional = true

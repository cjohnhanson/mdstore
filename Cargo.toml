[package]
name = "mdstore"
version = "0.2.0"
edition = "2024"
description = "Generic frontmattered markdown document store"
license = "MIT"
repository = "https://github.com/cjohnhanson/mdstore"
homepage = "https://github.com/cjohnhanson/mdstore"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["markdown", "frontmatter", "yaml", "document-store"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0"
thiserror = "2"
rand = "0.10.0"

[features]
default = []
# The MCP scaffold. Off by default: a consumer that only builds a CLI
# should not pull in a server stack.
mcp = ["dep:serde_json", "dep:sha2"]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.sha2]
version = "0.11.0"
optional = true

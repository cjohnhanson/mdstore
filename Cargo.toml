[package]
# The registry name. `mdstore` there belongs to an unrelated project,
# and a registry name is first-come and permanent, so this crate takes
# a qualified one. `[lib] name` below keeps the import path, so every
# consumer still writes `use mdstore::…` and only the dependency line
# changes.
name = "mdstore-core"
version = "0.3.6"
edition = "2024"
description = "Generic frontmattered markdown document store"
license = "MIT"
repository = "https://github.com/cjohnhanson/mdstore"
homepage = "https://github.com/cjohnhanson/mdstore"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["markdown", "frontmatter", "yaml", "document-store", "storage"]
categories = ["parser-implementations", "text-processing", "filesystem"]
# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, the changelog, and the two
# documents that concern them: the README and the security policy.
exclude = [
    ".tisket/",
    "tisket.yml",
    ".gaff/",
    ".github/",
    "scripts/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

# The import path stays `mdstore`, so no consumer source changes when
# the registry name does.
[lib]
name = "mdstore"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The git cache, in-process. `blocking-network-client` for fetch and
# clone; the reqwest transport for http(s), so no git or curl process
# runs. gix's file transport would spawn git-upload-pack, so a local
# source is mirrored by reading its object database directly (git.rs).
gix = { version = "0.86", default-features = false, features = [
    "revision",
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
# The https blob store: an index and its documents over plain GET. The
# same reqwest gix uses, so one HTTP stack.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }

# The pack writer for the mirror's first sync, and the object-store
# handle its Find side needs. Both already in the graph through gix;
# these lines only make the edge direct.
gix-pack = "0.73"
gix-odb = "0.83"
yaml_serde = "0.10"
thiserror = "2"
url = "2"
rand = "0.10.0"
cap-std = "4.0.2"

# The passwd database, for the home directory that anchors the user
# config path. $HOME is repo-settable (direnv, mise), and the user
# config names where writes land, so it never comes from the
# environment.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[features]
default = []
# The MCP scaffold. Off by default: a consumer that only builds a CLI
# should not pull in a server stack.
mcp = ["dep:serde_json", "dep:sha2"]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.sha2]
version = "0.11.0"
optional = true

# A released binary carries no debug symbols, and a user installing a
# CLI never reads them. Thin LTO with one codegen unit trades build
# time for size and speed. A release builds once and installs often.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

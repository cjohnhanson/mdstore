[package]
name = "mdstore-core"
version = "0.6.0"
edition = "2024"
description = "Generic frontmattered markdown document store"
license = "MIT"
repository = "https://github.com/cjohnhanson/mdstore"
homepage = "https://github.com/cjohnhanson/mdstore"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["markdown", "frontmatter", "yaml", "document-store", "storage"]
categories = ["parser-implementations", "text-processing", "filesystem"]
# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, the changelog, and the two
# documents that concern them: the README and the security policy.
exclude = [
    ".tisket/",
    "tisket.yml",
    ".gaff/",
    ".github/",
    "scripts/",
    # Shells out to scripts/merge-gate.sh, which the line above drops.
    "tests/merge_gate_guard.rs",
    # Vendored review skills and the manifest that pins them. Repository
    # machinery, and a consumer of the library never reads them.
    ".agents/",
    "almanac.yml",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

# The registry name is mdstore-core, because mdstore is taken. The lib
# keeps the name consumers import, so no source anywhere changes.
[lib]
name = "mdstore"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The git cache, in-process. `blocking-network-client` for fetch and
# clone; the reqwest transport for http(s), so no git or curl process
# runs. gix's file transport would spawn git-upload-pack, so a local
# source is mirrored by reading its object database directly (git.rs).
gix = { version = "0.87", default-features = false, features = [
    "revision",
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
# The https blob store: an index and its documents over plain GET. The
# same reqwest gix uses, so one HTTP stack.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }

# The pack writer for the mirror's first sync, and the object-store
# handle its Find side needs. Both already in the graph through gix;
# these lines only make the edge direct.
gix-pack = "0.74"
gix-odb = "0.84"
yaml_serde = "0.10"
thiserror = "2"
url = "2"
rand = "0.10.0"
# cap-std 4.0.3 requires cap-primitives ^4.0.3, which fixes
# RUSTSEC-2026-0482 (symlink escape from a confined store).
cap-std = "4.0.3"

# The passwd database, for the home directory that anchors the user
# config path. $HOME is repo-settable (direnv, mise), and the user
# config names where writes land, so it never comes from the
# environment.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[features]
default = []
# The MCP scaffold. Off by default: a consumer that only builds a CLI
# should not pull in a server stack.
mcp = ["dep:serde_json", "dep:sha2"]
# A store rendered as a book. Off by default: mdbook adds 57 packages,
# handlebars and elasticlunr among them, and a consumer that only reads
# documents should not pay for them. tokio is not one of the 57; reqwest
# and gix already carry it with no feature at all.
book = ["dep:mdbook-core", "dep:mdbook-html", "dep:mdbook-renderer"]
# The terminal UI kit the tools share: a keymap read from a config file,
# with a default and an Emacs preset, and the markdown editor the
# mdstore tools open on a document body. Off by default: a CLI or an
# MCP server should not compile a terminal stack. The ratatui split
# crates are the ones ratatui-textarea builds on, so a tool on ratatui
# 0.30 shares one copy of each.
tui = [
    "dep:ratatui-core",
    "dep:ratatui-widgets",
    "dep:ratatui-crossterm",
    "dep:ratatui-textarea",
    "dep:regex",
]

[dependencies.ratatui-core]
version = "0.1.2"
optional = true

[dependencies.ratatui-widgets]
version = "0.3.2"
optional = true

[dependencies.ratatui-crossterm]
version = "0.1.2"
optional = true

# The ratatui organisation's maintained successor to tui-textarea. The
# editor drives it only through its public editing methods, never its
# built-in key handling, so the configured keymap is the only one.
# `search` is the regex search the editor's incremental search runs on.
[dependencies.ratatui-textarea]
version = "0.9.4"
optional = true
default-features = false
features = ["crossterm", "search"]

# Escapes an incremental-search query, so the search is literal. The
# same regex ratatui-textarea's `search` feature compiles.
[dependencies.regex]
version = "1"
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.sha2]
version = "0.11.0"
optional = true

[dependencies.mdbook-core]
version = "0.5.4"
optional = true

[dependencies.mdbook-renderer]
version = "0.5.4"
optional = true

[dependencies.mdbook-html]
version = "0.5.4"
optional = true
features = ["search"]

[dev-dependencies]
# Snapshots of the editor drawn on ratatui's test backend.
insta = "1.49"
# Only tests/dependency_floor.rs uses toml to read Cargo.toml.
# Cargo.lock already includes it through the optional mdbook crates
# behind the book feature. A default build does not compile it.
# This dev-dependency does not reach consumers.
toml = "1"
